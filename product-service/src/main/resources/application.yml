server:
  port: 0

spring:
  application:
    name: product-service
  mongodb:
    uri: mongodb://localhost:27017/product-service

  kafka:
    bootstrap-servers: "localhost:9092"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring.json.type.mapping: product:com.learningTutorial.product_service.event.ProductPlacedEvent
      spring.json.trusted.packages: "com.learningTutorial.*"
eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-admin:password123@localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
       endpoint: http://localhost:9411/api/v2/spans

logging:
    pattern:
      level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
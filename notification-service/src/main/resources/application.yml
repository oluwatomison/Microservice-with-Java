server:
  port: 0
spring:
  application:
    name: notification-service

  # Kafka Configuration needs to be under spring.kafka
  kafka:
    bootstrap-servers: "localhost:9092"
    #    configure the order service to use the same key and value serializers
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: notificationId-v2
      auto-offset-reset: latest  # Ignore old messages
      properties:
        spring.json.type.mapping: event:com.learningTutorial.notification_service.OrderPlacedEvent, product:com.learningTutorial.notification_service.ProductPlacedEvent
        spring.json.trusted.packages: "com.learningTutorial.*"

  mail:
    host: smtp.gmail.com
    port: 587
    username: "Use your gmail id"
    password: "Gmail app password here"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans


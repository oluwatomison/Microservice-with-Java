services:
  postgres-order:
    container_name: postgres-order
    image: postgres:latest
    environment:
      POSTGRES_DB: postgres-service
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysql
      PGDATA: /data/postgres
#      Store all the data in the container folder called postgres-order
    volumes:
      - ./postgres-order:/data/postgres
    expose:
      - "5431"
    ports:
      - "5431:5431"
    command:
      -p 5431
    restart: unless-stopped
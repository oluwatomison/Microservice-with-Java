server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resource server:
        jwt:
          # This tells the Gateway where to get the public keys to verify tokens
          issuer-uri: http://localhost:8181/realms/spring-boot-microservices-realm

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/product, /api/product/**

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/order, /api/order/**

            - id: discovery-server
              uri: http://localhost:8761
              predicates:
                - Path=/eureka/**
              filters:
                - StripPrefix=1

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway.route: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    org.springframework.cloud.netflix.eureka: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
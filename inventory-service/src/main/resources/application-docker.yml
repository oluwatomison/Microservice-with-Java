server:
  port: 8080
spring:
  profiles:
    active: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/inventory-service
    username: root
    password: mysql
    driver-class-name: org.postgresql.Driver
management:
  tracing:
    sampling:
      probability: 1
    export:
      zipkin:
        endpoint: http://zipkin:9411
eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
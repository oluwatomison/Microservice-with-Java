server:
  port: 8761

spring:
  application:
    name: discovery-service
  security:
    user:
      name: eureka-admin
      password: password123

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
       endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"